
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#05060A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NEXO">
<meta name="format-detection" content="telephone=no">
<title>NEXO · finance OS</title>
<style>
/* ============ v2.0 · MODERNA FINANCE ============
   Nova identidade: app financeiro premium, leve e tecnológica,
   com inspiração em sistemas de design avançados para web/mobile.
   Mantém toda a lógica de dados, cálculos e persistência existentes.
*/
:root{
  --bg:#07131f;
  --mono:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Roboto Mono',monospace;
  --label:#edf5ff;
  --sec:#a5b4ca;
  --ter:#7d8ca5;
  --hair:rgba(255,255,255,.09);
  --glass:rgba(18,27,40,.70);
  --glass-deep:rgba(10,18,29,.96);
  --fill:rgba(130,150,182,.16);
  --tint:#82b8ff;
  --tint-txt:#061827;
  --tint-bg:rgba(130,184,255,.15);
  --acc2:#a58dff;
  --acc2-bg:rgba(165,141,255,.18);
  --red:#ff6f78;
  --red-bg:rgba(255,111,120,.14);
  --amber:#ffbf62;
  --amber-bg:rgba(255,191,98,.14);
  --spec:inset 0 1px 0 rgba(255,255,255,.08);
}

@media (prefers-color-scheme: light) {
  :root{
    --bg:#eef4ff;
    --label:#0d1728;
    --sec:#5a6c85;
    --ter:#7a869d;
    --hair:rgba(15,23,42,.07);
    --glass:rgba(255,255,255,.78);
    --glass-deep:rgba(255,255,255,.96);
    --fill:rgba(23,42,66,.08);
    --tint:#3d75f1;
    --tint-txt:#ffffff;
    --tint-bg:rgba(61,117,241,.10);
    --acc2:#7a62ef;
    --acc2-bg:rgba(122,98,239,.10);
    --red:#d85560;
    --red-bg:rgba(216,85,96,.10);
    --amber:#c67a00;
    --amber-bg:rgba(198,122,0,.10);
    --spec:inset 0 1px 0 rgba(255,255,255,.42);
  }
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,sans-serif;
  background:
    radial-gradient(80% 80% at 12% -10%, rgba(130,184,255,.25), transparent 42%),
    radial-gradient(70% 70% at 95% 0%, rgba(165,141,255,.18), transparent 38%),
    linear-gradient(180deg, var(--bg) 0%, color-mix(in srgb, var(--bg) 78%, #0d1d2e 22%) 100%);
  color:var(--label);font-size:16px;position:fixed;inset:0;width:100%;
  overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
/* aurora — pintada 1x, é a cena que os vidros flatten "refratam" */
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(36% 30% at 12% 10%, rgba(130,184,255,.32), transparent 52%),
    radial-gradient(38% 32% at 85% 6%, rgba(165,141,255,.26), transparent 48%),
    radial-gradient(32% 28% at 50% 98%, rgba(66,160,255,.14), transparent 56%),
    radial-gradient(28% 24% at 18% 82%, rgba(130,184,255,.10), transparent 54%);
}
/* grade técnica de instrumento, quase invisível */
body::after{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 46px),
    repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 1px,transparent 1px 46px);
}
@media (prefers-reduced-motion: reduce){
  *{transition-duration:0s!important;animation-duration:0s!important}
}
input,select{user-select:text;-webkit-user-select:text;font-family:inherit}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--tint);outline-offset:2px}
.ic{display:block;flex:0 0 auto}

/* ============ Estrutura ============ */
#views{position:absolute;inset:0;z-index:1}
.view{position:absolute;inset:0;display:none}
.view.on{display:block}
.navbar{
  position:absolute;top:0;left:0;right:0;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding-top:max(6px,env(safe-area-inset-top));height:calc(44px + max(6px,env(safe-area-inset-top)));
  transform:translateZ(0);transition:background .18s,box-shadow .18s;
}
.navbar.lif{background:linear-gradient(180deg, rgba(9,17,27,.86), rgba(9,17,27,.66));box-shadow:0 1px 0 var(--hair)}
.nb-t{font-size:17px;font-weight:600;opacity:0;transition:opacity .15s;white-space:nowrap}
.navbar.lif .nb-t{opacity:1}
.nb-l{display:flex;justify-content:flex-start}
.nb-r{display:flex;justify-content:flex-end}
.nb-btn{display:flex;align-items:center;gap:2px;background:none;border:0;color:var(--tint);font-size:17px;font-weight:500;height:44px;padding:0 10px;letter-spacing:-.2px}
.nb-btn:active{opacity:.5}
.nb-ic{display:flex;align-items:center;justify-content:center;width:38px;height:38px;background:none;border:0;color:var(--tint)}
.nb-ic:active{opacity:.5}
.scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:0 16px 180px;scrollbar-width:none;overscroll-behavior:none}
.scroll::-webkit-scrollbar{display:none}
.page{min-height:100%}
h1.lt{font-size:36px;font-weight:800;letter-spacing:-.9px;margin:14px 0 2px;padding:0 4px}
.sub{font-size:15px;color:var(--sec);padding:0 4px;margin-bottom:14px}
.sec-h{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:700;color:var(--sec);text-transform:uppercase;letter-spacing:.13em;padding:22px 16px 9px}
.lnk{background:none;border:0;color:var(--tint);font-size:13.5px;font-weight:600;padding:4px 0;text-transform:none;letter-spacing:0}
.foot{text-align:center;color:var(--ter);font-size:11.5px;padding:10px 0 24px}

/* ============ Cards de vidro flat ============ */
.card{
  background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));
  border:1px solid rgba(255,255,255,.08);
  border-radius:30px;overflow:hidden;margin-bottom:14px;
  box-shadow:0 24px 40px rgba(3,7,18,.24), inset 0 1px 0 rgba(255,255,255,.06);
  backdrop-filter:blur(20px) saturate(170%);
  -webkit-backdrop-filter:blur(20px) saturate(170%);
}
.card.press:active{background:rgba(30,36,48,.72)}
.card .row{content-visibility:auto;contain-intrinsic-size:46px}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:46px;position:relative}
.row+.row{border-top:.5px solid var(--hair)}
.press{cursor:pointer}
.row.press:active{background:rgba(255,255,255,.06)}
.grow{flex:1;min-width:0}
.t{font-size:16px;font-weight:550;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s{font-size:13px;color:var(--sec);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.35}
.val{font-size:16px;font-weight:600;letter-spacing:-.2px;text-align:right;white-space:nowrap}
.val.sm{font-size:14.5px}
.red{color:var(--red)}
.tint{color:var(--tint)}
.rcol{flex:0 0 auto}
.chev{color:var(--ter);display:flex}
.icb{width:34px;height:34px;border-radius:12px;background:var(--tint-bg);color:var(--tint);display:flex;align-items:center;justify-content:center;flex:0 0 34px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.kv{display:flex;justify-content:space-between;gap:16px;padding:11.5px 16px}
.kv+.kv{border-top:.5px solid var(--hair)}
.kv .k{font-size:13.5px;color:var(--sec);flex:0 0 auto;max-width:46%}
.kv .v{font-size:14.5px;font-weight:500;text-align:right;word-break:break-word}

/* números em mono — a assinatura do painel */
.big,.val,.krow .v,.stat .v,.donut-c .n,.ring-c .n,.tl-date .d,.pl-num,.stepper .num,.bdg{font-family:var(--mono)}
.big{font-size:36px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums;margin:5px 0 2px}
.big.sm{font-size:26px;letter-spacing:-.3px}

/* hero: vidro esmeralda com cantoneiras de mira */
.card.hero{
  background:linear-gradient(140deg, rgba(130,184,255,.22), rgba(165,141,255,.12) 40%, rgba(255,255,255,.04) 100%);
  border-color:rgba(167,191,255,.42);
  box-shadow:0 34px 60px rgba(22,47,82,.28), inset 0 1px 0 rgba(255,255,255,.14);
}
.card.hero::before{content:'';position:absolute;top:12px;left:12px;width:18px;height:18px;pointer-events:none;border-top:1.5px solid rgba(130,184,255,.90);border-left:1.5px solid rgba(130,184,255,.90)}
.card.hero::after{content:'';position:absolute;bottom:12px;right:12px;width:18px;height:18px;pointer-events:none;border-bottom:1.5px solid rgba(165,141,255,.90);border-right:1.5px solid rgba(165,141,255,.90)}
.hero{padding:20px 16px 18px}
.lbl{font-size:11px;color:rgba(230,240,235,.75);text-transform:uppercase;letter-spacing:.14em;font-weight:600}
.card.hero .s{color:rgba(230,240,235,.72)}
.finv{padding:14px 16px 8px}
.limb{padding:18px 16px 6px}
.invc{padding:16px 16px 12px}
.eyebtn{background:none;border:0;color:var(--sec);display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:99px}

/* donut + anel orbital (rotação pura — compositor, custo ~0) */
.donut .seg{transition:stroke-dashoffset .9s cubic-bezier(.2,.7,.2,1)}
.donut-wrap{position:relative;display:flex;align-items:center;justify-content:center}
.donut-c{position:absolute;text-align:center}
.donut-c .n{font-size:16px;font-weight:800;letter-spacing:-.3px}
.donut-c .l{font-size:9.5px;color:var(--sec);letter-spacing:.14em;text-transform:uppercase}
.ring-wrap{position:relative;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ring-c{position:absolute;text-align:center}
.ring-c .n{font-size:20px;font-weight:800;letter-spacing:-.4px}
.ring-c .l{font-size:9.5px;color:var(--sec)}
.orbit{position:absolute;inset:0;margin:auto;display:block;pointer-events:none;animation:spin 32s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.dlegend{display:flex;gap:14px;flex-wrap:wrap}
.dlegend span{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sec)}
.dlegend i{width:8px;height:8px;border-radius:99px;display:block}

/* status pulsante — o que está "ao vivo" */
.pulse{display:inline-block;width:7px;height:7px;border-radius:99px;background:var(--tint);position:relative;flex:0 0 7px}
.pulse::after{content:'';position:absolute;inset:-4px;border-radius:99px;border:1px solid var(--tint);opacity:0;animation:ping 2.2s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{0%{transform:scale(.4);opacity:.9}70%,100%{transform:scale(1.7);opacity:0}}
.pdot{display:inline-block;width:5px;height:5px;border-radius:99px;background:currentColor;margin-right:5px;vertical-align:1px;animation:blink 1.8s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* ticks */
.ticks{display:flex;gap:2.5px;padding:14px 16px 8px;flex-wrap:wrap}
.tick{flex:1 0 3px;height:15px;border-radius:5px;background:var(--fill)}
.tick.p{background:var(--tint)}
.tick.l{background:var(--red)}
.tlegend{display:flex;gap:16px;padding:0 16px 12px;font-size:12px;color:var(--sec)}

.krow{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;padding:4px 16px 16px}
.krow .k{font-size:10.5px;color:var(--sec);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.krow .v{font-size:15px;font-weight:700;margin-top:2px;white-space:nowrap}
.bar{height:8px;border-radius:99px;background:var(--fill);overflow:hidden;margin:8px 16px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--tint);transition:width .5s cubic-bezier(.32,.72,0,1)}
.bar.warn i{background:var(--amber)}
.bar.bad i{background:var(--red)}
.lrow{display:flex;justify-content:space-between;padding:0 16px 14px;font-size:13px;color:var(--sec)}
.lrow b{font-weight:600;color:var(--label)}

.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat{background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.09);border-radius:24px;padding:14px 16px;box-shadow:0 18px 32px rgba(7,15,26,.16), inset 0 1px 0 rgba(255,255,255,.05)}
.stat.press:active{background:rgba(30,36,48,.72)}
.stat .k{font-size:10.5px;color:var(--sec);text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.stat .v{font-size:19px;font-weight:800;letter-spacing:-.3px;margin-top:3px}
.stat .m{font-size:11.5px;color:var(--sec);margin-top:2px}

.dashboard-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:6px 0 14px}
.kpi{padding:16px;position:relative;overflow:hidden;min-height:168px}
.kpi::before{content:'';position:absolute;inset:0 0 auto 0;height:64%;background:linear-gradient(150deg, rgba(122,169,255,.12), transparent 68%);pointer-events:none}
.kpi-head{display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative;z-index:1}
.kpi-label{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--sec)}
.kpi-value{margin-top:14px;font-size:30px;font-weight:800;letter-spacing:-.45px;font-family:var(--mono);position:relative;z-index:1}
.kpi-meta{margin-top:8px;font-size:12px;line-height:1.45;color:var(--sec);position:relative;z-index:1}
.metric-strip{display:flex;align-items:flex-end;gap:6px;height:42px;margin-top:18px;position:relative;z-index:1}
.metric-strip span{flex:1;border-radius:10px 10px 6px 6px;background:linear-gradient(180deg, rgba(122,169,255,.92), rgba(155,139,255,.5));box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.metric-strip.reverse span{background:linear-gradient(180deg, rgba(155,139,255,.92), rgba(122,169,255,.48))}
.chip{display:inline-flex;align-items:center;justify-content:center;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.chip-tint{background:var(--tint-bg);color:var(--tint)}
.chip-purple{background:var(--acc2-bg);color:var(--acc2)}
.chip-ghost{background:var(--fill);color:var(--sec)}
.chart-panel{padding:18px 16px 14px;position:relative;overflow:hidden}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.panel-value{margin-top:8px;font-size:24px;font-weight:800;letter-spacing:-.35px;font-family:var(--mono)}
.chart-legend{display:flex;flex-wrap:wrap;gap:14px 18px;margin:16px 0 10px;font-size:12px;color:var(--sec)}
.chart-legend .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:1px}
.chart-legend strong{font-weight:700;color:var(--label)}
.dot-blue{background:#7aa9ff}
.dot-violet{background:#9b8bff}
.stack-bars{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.stack-track{height:12px;border-radius:999px;background:var(--fill);overflow:hidden;position:relative}
.stack-track i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg, var(--tint), var(--acc2));}
.stack-track.alt i{background:linear-gradient(90deg, var(--acc2), rgba(255,255,255,.34));}
.stack-track.warn i{background:linear-gradient(90deg, var(--amber), rgba(255,255,255,.26));}

.bank-shell{display:flex;flex-direction:column;gap:14px;padding-bottom:8px}
.bank-hero{
  position:relative;overflow:hidden;padding:18px 18px 14px;border-radius:32px;border:1px solid rgba(255,255,255,.10);
  background:linear-gradient(135deg, rgba(130,184,255,.22) 0%, rgba(165,141,255,.16) 38%, rgba(9,20,32,.90) 100%);
  box-shadow:0 28px 54px rgba(10,18,32,.30), inset 0 1px 0 rgba(255,255,255,.12);
}
.bank-hero::before{content:'';position:absolute;inset:-10% auto auto -8%;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle, rgba(255,255,255,.18), transparent 68%);pointer-events:none}
.bank-head{display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative;z-index:1}
.bank-brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:28px;height:28px;border-radius:10px;background:linear-gradient(135deg, #dbe9ff, #a9c8ff);color:#0f172a;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:13px}
.brand-name{font-size:15px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.bank-ghost{width:36px;height:36px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);color:var(--label);display:flex;align-items:center;justify-content:center}
.bank-summary{position:relative;z-index:1;margin-top:18px}
.bank-summary .mini-copy{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(237,245,255,.76)}
.bank-summary .big-amount{margin-top:8px;font-size:38px;font-weight:800;letter-spacing:-.7px;font-family:var(--mono)}
.summary-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.summary-line{display:flex;align-items:center;gap:8px;color:var(--label);font-weight:600}
.status-dot{width:8px;height:8px;border-radius:50%;background:#7ef0b6;box-shadow:0 0 0 4px rgba(126,240,182,.14)}
.summary-note{font-size:12px;color:rgba(237,245,255,.74)}
.hero-metrics{position:relative;z-index:1;margin-top:18px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.hero-metric{padding:11px 12px;border-radius:18px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08)}
.hero-metric span{display:block;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(237,245,255,.68)}
.hero-metric strong{display:block;margin-top:6px;font-size:14px;font-weight:700;letter-spacing:-.08px}
.quick-actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.quick-action{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;height:88px;border-radius:24px;border:1px solid rgba(255,255,255,.08);background:linear-gradient(180deg, rgba(255,255,255,.05), rgba(255,255,255,.02));box-shadow:0 18px 30px rgba(10,18,32,.16)}
.quick-icon{width:42px;height:42px;border-radius:14px;background:linear-gradient(135deg, rgba(130,184,255,.18), rgba(165,141,255,.18));display:flex;align-items:center;justify-content:center;color:var(--label)}
.quick-action span{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--sec)}
.bank-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.bank-card{background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.08);border-radius:26px;padding:16px}
.bank-card.highlight{background:linear-gradient(135deg, rgba(130,184,255,.16), rgba(165,141,255,.10) 40%, rgba(255,255,255,.02) 100%)}
.bank-card .small-label{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--sec)}
.bank-card .amount{margin-top:10px;font-size:24px;font-weight:800;letter-spacing:-.35px;font-family:var(--mono)}
.bank-card .meta{margin-top:8px;font-size:12px;color:var(--sec);line-height:1.4}
.bank-card .trend{margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.trend-pill{display:inline-flex;padding:5px 8px;border-radius:999px;background:var(--tint-bg);color:var(--tint);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.trend-pill.warn{background:var(--amber-bg);color:var(--amber)}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:4px 0 10px}
.section-head h3{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--sec)}
.section-link{font-size:12px;font-weight:700;color:var(--tint);background:none;border:0;padding:0}

.pill{font-size:12px;font-weight:700;padding:3.5px 9px;border-radius:99px;white-space:nowrap;flex:0 0 auto;box-shadow:inset 0 1px 0 rgba(255,255,255,.10);letter-spacing:.02em}
.pill.tint{color:var(--tint);background:var(--tint-bg)}
.pill.red{color:var(--red);background:var(--red-bg)}
.pill.amb{color:var(--amber);background:var(--amber-bg)}
.pill.gr{color:var(--sec);background:var(--fill)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:52px;border-radius:18px;font-size:17px;font-weight:600;border:0;width:100%;transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg, var(--tint), var(--acc2));color:var(--tint-txt);box-shadow:0 0 0 .5px rgba(255,255,255,.24),inset 0 1.5px 0 rgba(255,255,255,.38),0 20px 34px rgba(93,113,255,.28)}
.btn.quiet{background:linear-gradient(180deg, rgba(130,184,255,.12), rgba(130,184,255,.06));color:var(--tint);box-shadow:0 0 0 .5px rgba(130,184,255,.22),var(--spec)}
.btn.dang{background:linear-gradient(180deg, rgba(255,111,120,.10), rgba(255,111,120,.05));color:var(--red);box-shadow:0 0 0 .5px rgba(255,111,120,.18),var(--spec)}
.btns{display:flex;flex-direction:column;gap:10px;margin:14px 0 6px}
.pad{padding:12px 16px 16px}
.note{font-size:12.5px;color:var(--sec);line-height:1.5;padding:6px 18px 16px}
.note.in{padding:4px 16px 14px}

.field{display:flex;align-items:center;min-height:50px;padding:8px 16px;gap:12px}
.field+.field{border-top:.5px solid var(--hair)}
.field label{flex:1;font-size:15.5px}
.field input{background:none;border:0;outline:0;text-align:right;font-size:16.5px;font-weight:500;color:var(--tint);min-width:0;font-variant-numeric:tabular-nums;width:52%;font-family:var(--mono)}
.field input::placeholder{color:var(--ter);font-weight:400}
.field input[type=number]::-webkit-inner-spin-button,.field input[type=number]::-webkit-outer-spin-button{display:none}
.field select{background:none;border:0;outline:0;color:var(--tint);font-size:16px;font-weight:600;text-align:right;max-width:55%;-webkit-appearance:none;appearance:none}
.stepper{display:flex;align-items:center;background:rgba(255,255,255,.09);border-radius:12px;overflow:hidden;flex:0 0 auto;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.stepper button{width:38px;height:32px;border:0;background:none;font-size:19px;color:var(--tint);font-weight:500}
.stepper .num{min-width:36px;text-align:center;font-size:15px;font-weight:600}
.dotrow{display:flex;gap:12px;padding:14px 16px}
.cdot{width:30px;height:30px;border-radius:99px;border:0;position:relative}
.cdot.on::after{content:'';position:absolute;inset:-5px;border-radius:99px;border:2px solid var(--label)}

.logo{display:flex;align-items:center;justify-content:center;font-weight:800;letter-spacing:-.02em;flex:0 0 auto;white-space:nowrap;overflow:hidden}
.iss-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 8px;padding:12px 16px 14px}
.iss{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0}
.iss .logo{transition:box-shadow .15s}
.iss.on .logo{box-shadow:0 0 0 2.5px var(--bg),0 0 0 4.5px var(--tint)}
.iss .nm{font-size:10px;color:var(--sec);text-align:center;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iss.on .nm{color:var(--tint);font-weight:600}

.avt{width:38px;height:38px;border-radius:13px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;flex:0 0 38px;color:var(--sec);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.avt.tint{background:var(--tint-bg);color:var(--tint)}
.avt.red{background:var(--red-bg);color:var(--red)}
.avt .logo{border-radius:8px}

.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch;scroll-padding-left:2px;margin:0 -2px}
.carousel::-webkit-scrollbar{display:none}
.slide{scroll-snap-align:center;flex:0 0 calc(100% - 48px);cursor:pointer}
.plastic{
  aspect-ratio:1.62;border-radius:24px;padding:18px;position:relative;overflow:hidden;color:#fff;
  display:flex;flex-direction:column;justify-content:space-between;
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.26),0 12px 26px rgba(0,0,0,.38);
}
.plastic:active{transform:scale(.985);transition:transform .15s}
.plastic::after{content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(112deg,rgba(255,255,255,.15) 0%,rgba(255,255,255,.04) 30%,transparent 55%)}
.pl-top{display:flex;justify-content:space-between;align-items:center}
.pl-brand{font-weight:800;font-size:15px;letter-spacing:.02em;text-shadow:0 1px 3px rgba(0,0,0,.28)}
.pl-kind{font-size:10px;opacity:.78;letter-spacing:.14em;text-transform:uppercase}
.pl-mid{display:flex;gap:10px;align-items:center}
.pl-num{font-size:14.5px;letter-spacing:.24em;opacity:.88}
.pl-bot{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.pl-name{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-sub{font-size:11px;opacity:.78;margin-top:1px}
.pl-close{font-size:10.5px;opacity:.78;text-align:right;line-height:1.35;flex:0 0 auto}
.plastic.sm{border-radius:18px;padding:14px;aspect-ratio:auto;min-height:122px;box-shadow:inset 0 1.5px 0 rgba(255,255,255,.22),0 8px 20px rgba(0,0,0,.3)}
.dots{display:flex;justify-content:center;align-items:center;gap:5px;margin:2px auto 6px;width:max-content;
  background:rgba(13,17,24,.85);border:.5px solid rgba(255,255,255,.1);border-radius:99px;padding:8px 13px;box-shadow:var(--spec)}
.dot-i{width:6px;height:6px;border-radius:99px;background:var(--fill);border:0;padding:0;transition:width .25s,background .25s}
.dot-i.on{width:20px;background:var(--tint)}
.addslide{border:1.5px dashed var(--ter);border-radius:24px;aspect-ratio:1.62;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--sec);background:none}
.addslide .t{color:var(--sec);font-weight:600;font-size:14px}

.swipe-row{position:relative;overflow:hidden}
.sw-a{position:absolute;top:0;bottom:0;right:0;width:80px;display:flex}
.sw-del{flex:1;background:var(--red);color:#fff;display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;font-size:11px;font-weight:600;border:0}
.sw-c{position:relative;background:transparent;touch-action:pan-y;cursor:pointer}
.sw-c:active{background:rgba(255,255,255,.06)}
.swipe-row+.swipe-row .sw-c{border-top:.5px solid var(--hair)}
.swipe-row .sw-c{transition:transform .32s cubic-bezier(.32,.72,0,1)}

.empty{display:flex;flex-direction:column;align-items:center;gap:8px;padding:48px 24px;color:var(--sec)}
.empty.sm{padding:32px 24px}
.empty .ic{color:var(--ter)}
.empty .t{font-size:17px;font-weight:600;color:var(--label)}
.empty .s{font-size:13.5px;text-align:center;line-height:1.45}

/* ============ Tab bar: cápsula flat em layer própria ============ */
#tabbar{
  position:absolute;bottom:calc(10px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateZ(0);z-index:50;
  display:flex;gap:6px;
  background:rgba(11,19,31,.82);
  border:1px solid rgba(255,255,255,.08);
  border-radius:36px;padding:7px 8px;
  box-shadow:0 22px 36px rgba(7,15,26,.38), inset 0 1px 0 rgba(255,255,255,.10);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
}
.tab{border-radius:24px;padding:6px 11px;display:flex;flex-direction:column;align-items:center;gap:2.5px;color:var(--sec);
  font-size:9.5px;font-weight:700;background:none;border:0;position:relative;min-width:76px;letter-spacing:.02em;transition:background .2s,color .2s}
.tab .f{display:none}
.tab.on{color:var(--label);background:linear-gradient(180deg, rgba(130,184,255,.22), rgba(165,141,255,.16));box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 10px 20px rgba(97,120,255,.22)}
.tab.on .f{display:block}
.tab.on .o{display:none}
.bdg{position:absolute;top:2px;left:calc(50% + 13px);min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 4px;font-style:normal}
.bdg:not(:empty){display:flex}

#fab{position:absolute;right:16px;bottom:calc(106px + max(6px,env(safe-area-inset-bottom)));z-index:60;
  width:60px;height:60px;border-radius:22px;background:linear-gradient(135deg, var(--tint), var(--acc2));color:var(--tint-txt);
  display:flex;align-items:center;justify-content:center;border:0;transition:transform .15s;
  box-shadow:0 0 0 .5px rgba(255,255,255,.24),inset 0 2px 0 rgba(255,255,255,.40),0 22px 34px rgba(93,113,255,.30)}
#fab:active{transform:scale(.90)}

/* ============ Push: opaco + aurora própria (bug de sobreposição corrigido) ============ */
#stack{position:absolute;inset:0;z-index:100;pointer-events:none}
.push{position:absolute;inset:0;background:var(--bg);transform:translateX(100%);transition:transform .42s cubic-bezier(.32,.72,0,1);pointer-events:auto;display:flex;flex-direction:column}
.push.in{transform:translateX(0)}
.push::before{content:'';position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(44% 40% at 16% 10%, rgba(46,229,154,.15), transparent 62%),
  radial-gradient(50% 44% at 86% 6%, rgba(127,169,255,.12), transparent 64%),
  radial-gradient(54% 46% at 72% 92%, rgba(46,229,154,.09), transparent 66%),
  radial-gradient(42% 38% at 8% 88%, rgba(84,140,210,.08), transparent 60%),
  repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 44px),
  repeating-linear-gradient(90deg,rgba(255,255,255,.02) 0 1px,transparent 1px 44px)}
.push .navbar{position:relative;flex:0 0 auto;background:rgba(8,11,16,.94);box-shadow:0 .5px 0 var(--hair);padding-left:4px;transform:none}
.push .navbar .nb-t{opacity:1}
.push .scroll{position:relative;flex:1;padding-top:4px}

/* ============ Sheet flat ============ */
#sheet-root{position:fixed;inset:0;z-index:200;pointer-events:none}
#sheet-root.show{pointer-events:auto}
#sheet-root .bk{position:absolute;inset:0;background:rgba(0,0,0,.5);opacity:0;transition:opacity .3s}
#sheet-root.show .bk{opacity:1}
#sheet-root .sheet{
  position:absolute;left:0;right:0;bottom:0;background:var(--glass-deep);
  border:.5px solid rgba(255,255,255,.1);border-bottom:0;
  border-radius:28px 28px 0 0;max-height:calc(100% - 56px);display:flex;flex-direction:column;
  transform:translateY(105%);transition:transform .46s cubic-bezier(.32,.72,0,1);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 -16px 40px rgba(0,0,0,.45);
}
#sheet-root.show .sheet{transform:translateY(0)}
.grip{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.22);margin:9px auto 2px;flex:0 0 auto;touch-action:none;cursor:grab;align-self:center;padding:8px 0;background-clip:content-box}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 16px calc(20px + env(safe-area-inset-bottom))}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:8px 4px 12px}
.sh-title{font-size:21px;font-weight:700;letter-spacing:-.5px}
.sh-x{width:31px;height:31px;border-radius:99px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;border:0;color:var(--sec);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.sh-x:active{opacity:.5}

#alert-root{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:24px}
#alert-root.show{display:flex}
#alert-root .bk{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .22s}
#alert-root.on .bk{opacity:1}
.al{position:relative;width:min(286px,84vw);background:rgba(21,26,35,.97);border:.5px solid rgba(255,255,255,.12);
  border-radius:24px;overflow:hidden;text-align:center;transform:scale(1.14);opacity:0;transition:transform .3s cubic-bezier(.2,1.1,.3,1),opacity .2s;
  box-shadow:var(--spec),0 20px 50px rgba(0,0,0,.5)}
#alert-root.on .al{transform:scale(1);opacity:1}
.al .ttl{font-size:16.5px;font-weight:700;padding:18px 18px 6px;letter-spacing:-.2px}
.al .msg{font-size:13.5px;color:var(--sec);padding:2px 18px 16px;line-height:1.45}
.al .btns{display:flex;border-top:.5px solid var(--hair)}
.al .btns button{flex:1;height:48px;border:0;background:none;font-size:16.5px;color:var(--tint);font-weight:500}
.al .btns button+button{border-left:.5px solid var(--hair)}
.al .btns button:first-child{font-weight:700;color:var(--label)}
.al .btns button.ok.d{color:var(--red);font-weight:600}
#as-root{position:fixed;inset:0;z-index:260;pointer-events:none}
#as-root.show{pointer-events:auto}
#as-root .as-bk{position:absolute;inset:0;background:rgba(0,0,0,.45);opacity:0;transition:opacity .3s}
#as-root.show .as-bk{opacity:1}
#as-root .as-wrap{position:absolute;bottom:0;left:8px;right:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;transform:translateY(110%);transition:transform .42s cubic-bezier(.32,.72,0,1)}
#as-root.show .as-wrap{transform:none}
.as-card{background:rgba(21,26,35,.97);border:.5px solid rgba(255,255,255,.12);border-radius:22px;overflow:hidden;box-shadow:var(--spec),0 14px 36px rgba(0,0,0,.42)}
.as-t{padding:13px 16px 11px;text-align:center;font-size:13px;color:var(--sec)}
.as-b{display:block;width:100%;min-height:54px;border:0;background:none;font-size:17px;color:var(--tint);border-top:.5px solid var(--hair)}
.as-b:first-of-type{border-top:0}
.as-b.d{color:var(--red)}
.as-b.c{font-weight:700;color:var(--label)}

#toast-root{position:fixed;top:calc(max(6px,env(safe-area-inset-top)) + 56px);left:0;right:0;display:flex;justify-content:center;z-index:400;pointer-events:none}
.toast{background:rgba(19,23,31,.96);border:.5px solid rgba(255,255,255,.12);color:#fff;border-radius:99px;padding:11px 18px;font-size:14px;font-weight:500;display:flex;align-items:center;gap:9px;opacity:0;transform:translateY(-14px) scale(.94);transition:.34s cubic-bezier(.2,1,.3,1);box-shadow:var(--spec),0 10px 26px rgba(0,0,0,.4);max-width:86vw}
.toast.in{opacity:1;transform:none}
.toast .ic{color:var(--tint)}
.toast.err .ic{color:var(--red)}

.step{display:flex;gap:12px;padding:12px 16px;align-items:flex-start}
.step+.step{border-top:.5px solid var(--hair)}
.step .n{width:22px;height:22px;border-radius:99px;background:var(--tint-bg);color:var(--tint);font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:0 0 22px;margin-top:1px}
.step p{font-size:14px;line-height:1.45}
.mini-del{width:38px;height:38px;border:0;background:none;color:var(--red);display:flex;align-items:center;justify-content:center}
  :root{
    --bg:#040915;
    --bg-soft:#0b1220;
    --bg-2:#0f1c2e;
    --panel:#101b2d;
    --panel-strong:#0d1625;
    --glass:rgba(14,22,36,.74);
    --glass-deep:rgba(7,12,21,.96);
    --hair:rgba(148,163,184,.16);
    --fill:rgba(148,163,184,.12);
    --label:#edf8ff;
    --sec:#a7bfd5;
    --ter:#7f97af;
    --tint:#6ee7ff;
    --tint-2:#8b5cf6;
    --tint-txt:#02151d;
    --tint-bg:rgba(110,231,255,.16);
    --acc2:#7dd3fc;
    --acc2-bg:rgba(125,211,252,.16);
    --red:#ff6b7d;
    --red-bg:rgba(255,107,125,.18);
    --amber:#ffbf69;
    --amber-bg:rgba(255,191,105,.16);
  }

  body{
    background:
      radial-gradient(900px 700px at 12% -4%, rgba(110,231,255,.18), transparent 42%),
      radial-gradient(1000px 760px at 90% 0%, rgba(139,92,246,.22), transparent 38%),
      linear-gradient(180deg, #030914 0%, #0a1220 38%, #07111d 100%);
  }

  body::before{
    background:
      radial-gradient(38% 38% at 18% 18%, rgba(110,231,255,.18), transparent 58%),
      radial-gradient(42% 42% at 82% 12%, rgba(139,92,246,.22), transparent 58%),
      radial-gradient(48% 42% at 72% 88%, rgba(39,197,255,.10), transparent 60%),
      radial-gradient(30% 30% at 12% 82%, rgba(110,231,255,.08), transparent 58%);
  }

  body::after{
    background:
      repeating-linear-gradient(0deg, rgba(148,163,184,.03) 0 1px, transparent 1px 44px),
      repeating-linear-gradient(90deg, rgba(148,163,184,.03) 0 1px, transparent 1px 44px);
    opacity:.9;
  }

  h1.lt{
    font-size:34px;
    letter-spacing:-.065em;
    text-shadow:0 0 22px rgba(110,231,255,.16);
  }

  .sub{color:var(--sec)}

  .card{
    background:linear-gradient(180deg, rgba(17,27,41,.82), rgba(12,19,30,.95));
    border:1px solid rgba(147,197,253,.12);
    border-radius:28px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 22px 40px rgba(2,6,23,.35);
    position:relative;
  }

  .card::before{
    content:'';
    position:absolute;
    inset:0;
    pointer-events:none;
    border-radius:inherit;
    background:linear-gradient(135deg, rgba(255,255,255,.08), transparent 24%, transparent 80%, rgba(110,231,255,.06));
  }

  .card.press:active{background:linear-gradient(180deg, rgba(24,38,58,.9), rgba(12,19,30,.96))}

  .card.hero{
    background:linear-gradient(135deg, rgba(15,50,62,.82), rgba(14,24,39,.98) 45%, rgba(17,26,38,.96));
    border-color:rgba(110,231,255,.28);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.10), 0 24px 40px rgba(1,7,17,.45), 0 0 0 1px rgba(110,231,255,.08);
  }

  .card.hero::before{
    border-top:1.5px solid rgba(110,231,255,.55);
    border-left:1.5px solid rgba(110,231,255,.55);
    left:10px;
    top:10px;
    width:16px;
    height:16px;
    border-radius:0;
  }

  .card.hero::after{
    border-bottom:1.5px solid rgba(139,92,246,.55);
    border-right:1.5px solid rgba(139,92,246,.55);
    right:10px;
    bottom:10px;
    width:16px;
    height:16px;
    border-radius:0;
  }

  .hero .lbl,
  .stat .k,
  .sec-h,
  .krow .k,
  .pill,
  .dot-i,
  .iss .nm,
  .pl-kind,
  .pl-close,
  .note,
  .step p,
  .tlegend,
  .k .k,
  .kv .k,
  .field label,
  .sh-title,
  .as-t,
  .al .msg{
    letter-spacing:.02em;
  }

  .sec-h{
    font-size:12px;
    letter-spacing:.10em;
    font-weight:700;
    color:var(--sec);
    text-transform:uppercase;
    padding-top:26px;
  }

  .val,
  .big,
  .ring-c .n,
  .donut-c .n,
  .pl-num,
  .stat .v,
  .krow .v,
  .navb-t,
  .nb-t,
  .sh-head,
  .field input,
  .field select,
  .stepper .num,
  .bdg{
    font-variant-numeric:tabular-nums;
  }

  .row.press:active{background:rgba(255,255,255,.04)}

  .stat{
    background:linear-gradient(180deg, rgba(16,27,44,.8), rgba(11,18,30,.95));
    border:1px solid rgba(147,197,253,.12);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 16px 28px rgba(0,0,0,.22);
  }

  .stat.press:active{background:linear-gradient(180deg, rgba(24,39,58,.9), rgba(12,19,30,.96))}

  .pill.tint{background:linear-gradient(135deg, rgba(110,231,255,.15), rgba(139,92,246,.12)); border:1px solid rgba(110,231,255,.25)}
  .pill.red{background:linear-gradient(135deg, rgba(255,107,125,.16), rgba(255,107,125,.10)); border:1px solid rgba(255,107,125,.28)}
  .pill.amb{background:linear-gradient(135deg, rgba(255,191,105,.14), rgba(255,191,105,.08)); border:1px solid rgba(255,191,105,.24)}
  .pill.gr{background:rgba(148,163,184,.08); border:1px solid rgba(148,163,184,.14)}

  .btn.pri{
    background:linear-gradient(135deg, rgba(110,231,255,1), rgba(139,92,246,1));
    color:#03151d;
    box-shadow:0 16px 28px rgba(110,231,255,.22), inset 0 1px 0 rgba(255,255,255,.33);
  }

  .btn.quiet{
    background:linear-gradient(180deg, rgba(110,231,255,.10), rgba(110,231,255,.04));
    border:1px solid rgba(110,231,255,.22);
    color:var(--tint);
  }

  .btn.dang{
    background:linear-gradient(180deg, rgba(255,107,125,.16), rgba(255,107,125,.10));
    border:1px solid rgba(255,107,125,.18);
    color:var(--red);
  }

  #tabbar{
    background:rgba(8,15,24,.88);
    border:1px solid rgba(148,163,184,.14);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 20px 40px rgba(1,6,17,.42);
    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);
  }

  .tab{
    min-width:74px;
    border-radius:22px;
    color:var(--sec);

<script>

/* =====================================================================

/* ---------- utilidades ---------- */
const $  = s => document.querySelector(s);

const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayStr = () => ymd(new Date());
const pD  = s => { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const r2  = v => Math.round(v*100)/100;
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc = s => String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmtNum = v => Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fmtV = v => (v==null||isNaN(v)) ? '—' : (S&&S.hide ? 'R$ ∙∙∙∙∙' : fmtNum(v));
const realV = v => (v==null||isNaN(v)) ? '—' : fmtNum(v);
const fmtIn = v => (v==null||v==='') ? '' : Number(v).toFixed(2).replace('.',',');
const MONTHS=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const MON=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const fmtDate = s => { const d=pD(s); return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear(); };

function parseMoney(s){ s=String(s??'').trim().replace(/[^\d,.-]/g,''); if(!s) return null; if(s.includes(',')) s=s.replace(/\./g,'').replace(',','.'); const v=parseFloat(s); return isNaN(v)?null:r2(v); }

/* ---------- emissores ---------- */
const COLORS=['#0E7C5C','#33475B','#7C3A38','#7E5B22','#33363C','#44523D'];
const ISSUERS=[
  {k:'nubank',   n:'Nubank',          bg:'#820AD1',fg:'#fff',t:'nu'},

  {k:'mp',       n:'Mercado Pago',    bg:'#009EE3',fg:'#fff',t:'MP'},
  {k:'picpay',   n:'PicPay',          bg:'#21C25E',fg:'#fff',t:'P'},
  {k:'original', n:'Original',        bg:'#23262E',fg:'#fff',t:'O'},
  {k:'btg',      n:'BTG+',            bg:'#0A2C5E',fg:'#F7C600',t:'btg+'},
  {k:'neon',     n:'Neon',            bg:'#23262E',fg:'#2BE0FF',t:'N'},

];
const ISSUER_MATCH={
  nubank:['nubank'],itau:['itaú','itau'],bradesco:['bradesco'],bb:['banco do brasil'],
  caixa:['caixa','cef'],santander:['santander'],c6:['c6'],inter:['inter'],
  mp:['mercado pago','mercadopago'],picpay:['picpay'],original:['original'],
  btg:['btg'],neon:['neon'],next:['next'],will:['will']
};
function detectIssuer(str){
  const s=(str||'').toLowerCase(); if(!s) return null;
  for(const k in ISSUER_MATCH){ if(ISSUER_MATCH[k].some(t=>s.includes(t))) return k; }
  return null;
}
const tileFs=(t,px)=>{const l=t.length;const f=l<=2?.42:l<=3?.34:l<=5?.26:l<=6?.22:.19;return (px*f).toFixed(1);};
const issOf=c=>ISSUERS.find(i=>i.k===c.issuerKey);
function logoTile(c,px=36){
  const i=issOf(c), br=(px*.27).toFixed(1);
  if(i) return `<span class="logo" style="width:${px}px;height:${px}px;border-radius:${br}px;background:${i.bg};color:${i.fg};font-size:${tileFs(i.t,px)}px;box-shadow:inset 0 1px 0 rgba(255,255,255,.22)">${i.t}</span>`;
  const nm=(c.issuer||c.name||'cartão').trim();
  return `<span class="logo" style="width:${px}px;height:${px}px;border-radius:${br}px;background:${c.color||'#8E8E93'};color:#fff;font-size:${(px*.4).toFixed(1)}px;box-shadow:inset 0 1px 0 rgba(255,255,255,.22)">${esc(nm.charAt(0).toUpperCase())}</span>`;
}
const issuerName=c=>{ const i=issOf(c); return i?i.n:(c.issuer||''); };
const logoColor=c=>{ const i=issOf(c); return i?i.bg:(c.color||'#8E8E93'); };
function shade(hex,amt){
  const h=hex.replace('#','');
  const full=h.length===3?h.split('').map(c=>c+c).join(''):h;
  const n=parseInt(full,16);
  const cl=v=>Math.max(0,Math.min(255,v));
  const r=cl((n>>16)+amt), g=cl(((n>>8)&255)+amt), b=cl((n&255)+amt);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}

/* ---------- estado + semente (contrato Santander do anexo) ---------- */
const LS='carteira.v1';
function genInstallments(c){
  const [y,m,d]=c.firstDue.split('-').map(Number), arr=[];
  for(let i=1;i<=c.n;i++) arr.push({n:i, due:ymd(new Date(y,m-1+i-1,d)), nominal:r2(c.pmt)});
  return arr;
}
function defaultState(){
  const contract={
    op:'133171897/00711383693', bank:'Santander SCCFI S.A.', bankCNPJ:'07.707.650/0001-10',
    client:'Josenildo Guedes Santos', cpf:'037.382.924-89', dealer:'BG Multimarcas LTDA',
    vehicle:{brand:'Toyota',model:'Corolla GLI 1.8 Flex 16V Aut.',year:'2011',color:'Prata',plate:'NNZ2H70',chassi:'9BRBB42E0B5151146',renavam:'270621229'},
    price:59900.00, prestamista:894.31, ap:4683.94, regTraffic:400.00, subtotal:65878.25,
    down:1703.75, tCad:1199.00, tAval:799.00, finNoTax:66172.50, iof:1883.61, iofAdd:251.45,
    financed:68307.56, n:48, pmt:2159.58, firstDue:'2026-05-25',
    rateD:0.06, rateM:1.85, rateA:24.61, cetM:2.62, cetA:36.92,
    totalPaid:105363.59, payMethod:'Boleto', insurer:'Zurich Santander',
    apPrest:'1099454', apAP:'0002972', signed:'2026-04-25', place:'Natal/RN'
  };
  const s={v:1,createdAt:Date.now(),lastBackup:null,hide:false,fin:{contract,installments:[]},cards:[],expenses:[],invPay:{}};
  s.fin.installments=genInstallments(contract);
  return s;
}
function migrate(s){
  (s.fin&&s.fin.installments||[]).forEach(it=>{
    if(it.paid) it.paid.discount=r2(Math.max(0,it.nominal-it.paid.amount));
  });
  (s.cards||[]).forEach(c=>{
    if(!c.issuerKey){ const k=detectIssuer((c.issuer||'')+' '+(c.name||'')); if(k) c.issuerKey=k; }
  });
  if(!s.invPay) s.invPay={};
  if(s.hide===undefined) s.hide=false;
  return s;
}
let S;
try{ S=JSON.parse(localStorage.getItem(LS)) || defaultState(); }catch(e){ S=defaultState(); }
if(!S.fin||!S.fin.installments) S=defaultState();
migrate(S);
function save(){ S.updatedAt=Date.now(); try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){} }

/* ---------- Módulo 1: financiamento ---------- */
function instState(it){ return (it.paid && it.paid.amount>0.005) ? 'paid' : 'open'; }
function finStats(){
  const ins=S.fin.installments;
  let paid=0,paidAmt=0,disc=0,late=0,next=null,openRest=0;
  ins.forEach(it=>{
    if(instState(it)==='paid'){ paid++; paidAmt+=it.paid.amount; disc+=(it.paid.discount||0); }
    else{ openRest+=it.nominal; if(!next) next=it; if(daysTo(it.due)<0) late++; }
  });
  return {count:ins.length,paid,paidAmt:r2(paidAmt),disc:r2(disc),late,next,openRest:r2(openRest)};
}
function priceBalance(k){
  const c=S.fin.contract, i=c.rateM/100;
  if(k>=c.n||i<=0) return 0;
  const f=Math.pow(1+i,k);
  return r2(Math.max(0, c.financed*f - c.pmt*(f-1)/i));
}
function regenerateInstallments(){
  const old={}; S.fin.installments.forEach(it=>{ if(it.paid) old[it.n]=it.paid; });
  S.fin.installments=genInstallments(S.fin.contract);
  S.fin.installments.forEach(it=>{ if(old[it.n]) it.paid=old[it.n]; });
}
function applySettle(val,date){
  const open=S.fin.installments.filter(i=>instState(i)!=='paid');
  if(!open.length) return;
  const sum=r2(open.reduce((s,i)=>s+i.nominal,0));
  const ratio=sum>0?val/sum:0; let acc=0;
  open.forEach((it,idx)=>{
    let amt = idx===open.length-1 ? r2(val-acc) : r2(it.nominal*ratio);
    acc=r2(acc+amt);
    amt=Math.max(0,Math.min(amt,it.nominal));
    it.paid={date,amount:amt,discount:r2(it.nominal-amt)};
  });
}

/* ---------- Módulo 2: cartões e faturas ---------- */
const cardById=id=>S.cards.find(c=>c.id===id);
function splitInstallments(total,n){
  if(n<=1) return [r2(total)];
  const b=r2(total/n), arr=Array(n).fill(b);
  arr[n-1]=r2(total-b*(n-1));
  return arr;
}
function cycAdd(c,k){ let m=c.m+k,y=c.y; y+=Math.floor((m-1)/12); m=((m-1)%12)+1; return {y,m}; }
function purchaseCycle(dateStr,closeDay){
  const [y,m,d]=dateStr.split('-').map(Number);
  return d>closeDay ? cycAdd({y,m},1) : {y,m};
}
function currentOpenCycle(card){
  const t=new Date(); let y=t.getFullYear(),m=t.getMonth()+1;
  if(t.getDate()>card.closeDay) return cycAdd({y,m},1);
  return {y,m};
}
const cycKey=c=>c.y+'-'+pad(c.m);
function invoiceDates(card,cyc){
  const dim=(y,m)=>new Date(y,m,0).getDate();
  const cd=Math.min(card.closeDay,dim(cyc.y,cyc.m));
  let y=cyc.y,m=cyc.m;
  if(card.dueDay<=card.closeDay){ m++; if(m>12){m=1;y++;} }
  return {close:new Date(cyc.y,cyc.m-1,cd), due:new Date(y,m-1,Math.min(card.dueDay,dim(y,m)))};
}
function cardCycles(card){
  const map=new Map();
  S.expenses.filter(e=>e.cardId===card.id).forEach(e=>{
    const first=purchaseCycle(e.date,card.closeDay);
    const units=splitInstallments(e.total,e.n);
    for(let k=0;k<e.n;k++){
      const cy=cycAdd(first,k), key=cycKey(cy);
      if(!map.has(key)) map.set(key,{key,y:cy.y,m:cy.m,items:[]});
      map.get(key).items.push({eid:e.id,desc:e.desc,k:k+1,n:e.n,val:units[k]});
    }
  });
  const open=currentOpenCycle(card), ok=cycKey(open);
  if(!map.has(ok)) map.set(ok,{key:ok,y:open.y,m:open.m,items:[]});
  const pays=S.invPay[card.id]||{};
  Object.keys(pays).forEach(k=>{
    if(pays[k]&&pays[k].length&&!map.has(k)){ const [y,m]=k.split('-').map(Number); map.set(k,{key:k,y,m,items:[]}); }
  });
  return [...map.values()].sort((a,b)=>b.key<a.key?1:-1);
}
function invoiceCalc(card,cyc){
  const items=cyc.items||[];
  const total=r2(items.reduce((s,i)=>s+i.val,0));
  const pays=(S.invPay[card.id]||{})[cyc.key]||[];
  const paidAmt=r2(pays.reduce((s,p)=>s+p.amount,0));
  const rest=Math.max(0,r2(total-paidAmt));
  const dd=invoiceDates(card,cyc);
  const close=ymd(dd.close), due=ymd(dd.due), today=todayStr();
  let status;
  if(total<=0.005&&paidAmt<=0.005) status='empty';
  else if(paidAmt+0.005>=total) status='paid';
  else if(close>today) status=(cyc.key===cycKey(currentOpenCycle(card)))?'current':'future';
  else if(due>=today) status='closed';
  else status='overdue';
  return {cyc,items,total,paidAmt,rest,close,due,status};
}
function findInv(card,key){ const c=cardCycles(card).find(x=>x.key===key); return c?invoiceCalc(card,c):null; }
function cardUsage(card){
  let toPay=0,toLaunch=0;
  cardCycles(card).forEach(cyc=>{
    const inv=invoiceCalc(card,cyc);
    if(inv.status==='paid'||inv.status==='empty') return;
    if(inv.close<=todayStr()) toPay+=inv.rest; else toLaunch+=inv.rest;
  });
  const used=r2(toPay+toLaunch);
  return {used,toPay:r2(toPay),toLaunch:r2(toLaunch),avail:Math.max(0,r2(card.limit-used))};
}
function pillFor(st){
  return st==='paid'?{cls:'tint',txt:'Paga'}
    : st==='current'?{cls:'tint',txt:'<span class="pdot"></span>Atual'}
    : st==='future'?{cls:'gr',txt:'Prevista'}
    : st==='closed'?{cls:'amb',txt:'Em aberto'}
    : st==='overdue'?{cls:'red',txt:'Vencida'}
    : {cls:'gr',txt:'—'};
}
function nextPendingInvoice(c){
  let best=null;
  cardCycles(c).forEach(cy=>{
    const inv=invoiceCalc(c,cy);
    if(inv.status==='paid'||inv.status==='empty'||inv.rest<=0.005) return;
    if(!best||inv.due<best.due) best=inv;
  });
  return best;
}

/* ---------- agenda e atividade ---------- */
function upcomingEvents(){
  const t0=+pD(todayStr()), H=t0+30*864e5, evs=[];
  S.fin.installments.forEach(it=>{
    if(instState(it)==='paid') return;
    const d=+pD(it.due); if(d>H) return;
    evs.push({t:d,kind:d<t0?'late':'fin',title:'Parcela '+it.n+' • Financiamento',val:it.nominal,act:'inst',n:it.n});
  });
  S.cards.forEach(c=>cardCycles(c).forEach(cy=>{
    const inv=invoiceCalc(c,cy); if(inv.status==='empty') return;
    const cd=+pD(inv.close);
    if(cd>=t0&&cd<=H) evs.push({t:cd,kind:'close',title:'Fecha fatura '+c.name,val:inv.total,act:'card',id:c.id});
    if(inv.status!=='paid'&&inv.rest>0.005){
      const dd=+pD(inv.due);
      if(dd<=H) evs.push({t:dd,kind:dd<t0?'late':'due',title:(dd<t0?'Fatura vencida • ':'Vence fatura ')+c.name,val:inv.rest,act:'invoice',id:c.id,key:cy.key});
    }
  }));
  evs.sort((a,b)=>a.t-b.t);
  return evs.slice(0,12);
}
function monthCommitments(){
  const now=new Date(), m=now.getMonth(), y=now.getFullYear();
  let total=0,finN=0,cardN=0,finV=0,cardV=0;
  S.fin.installments.forEach(it=>{
    if(instState(it)==='paid') return;
    const d=pD(it.due);
    if(d.getMonth()===m&&d.getFullYear()===y){ total+=it.nominal; finN++; finV+=it.nominal; }
  });
  S.cards.forEach(c=>cardCycles(c).forEach(cy=>{
    const inv=invoiceCalc(c,cy);
    if(inv.status==='paid'||inv.status==='empty') return;
    const d=pD(inv.due);
    if(d.getMonth()===m&&d.getFullYear()===y){ total+=inv.rest; cardN++; cardV+=inv.rest; }
  }));
  return {total:r2(total),finN,cardN,finV:r2(finV),cardV:r2(cardV),label:MONTHS[m]};
}
function activityFeed(limit=6){
  const acts=[];
  S.fin.installments.forEach(it=>{
    if(it.paid) acts.push({date:it.paid.date,kind:'fin',title:'Parcela '+it.n,sub:'Financiamento '+esc(S.fin.contract.bank.split(' ')[0]),amount:it.paid.amount});
  });
  S.expenses.forEach(e=>{
    const c=cardById(e.cardId);
    acts.push({date:e.date,kind:'exp',card:c,title:e.desc,sub:(e.n>1?e.n+'× parcelado':'à vista')+(c?' • '+esc(c.name):''),amount:e.total});
  });
  S.cards.forEach(c=>{
    Object.entries(S.invPay[c.id]||{}).forEach(([key,pays])=>{
      pays.forEach(p=>acts.push({date:p.date,kind:'pay',card:c,title:'Fatura '+MONTHS[+key.slice(5)-1],sub:esc(c.name),amount:p.amount}));
    });
  });
  acts.sort((a,b)=> b.date===a.date ? 0 : (b.date<a.date?-1:1));
  return acts.slice(0,limit);
}

/* navbar colapsa via IntersectionObserver: zero custo durante o scroll */
function bindNavbar(sc,nv){
  if(sc._navBound) return; sc._navBound=true;
  const sent=document.createElement('div');
  sent.style.cssText='position:absolute;top:60px;left:0;width:1px;height:1px;pointer-events:none';
  sc.prepend(sent);
  new IntersectionObserver(es=>{
    nv.classList.toggle('lif',!es[0].isIntersecting);
  },{root:sc}).observe(sent);
}
function pushScreen(navTitle,backLabel,rightHtml){
  const el=document.createElement('div'); el.className='push';
  el.innerHTML=`<header class="navbar">
    <div class="nb-l"><button class="nb-btn" data-act="pop">${icon('back',18)}<span>${backLabel}</span></button></div>
    <div class="nb-t">${navTitle}</div>
    <div class="nb-r">${rightHtml||''}</div></header>
    <div class="scroll"><div class="page"></div></div>`;
  stack.appendChild(el);
  bindNavbar(el.querySelector('.scroll'),el.querySelector('.navbar'));
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add('in')));
  return el;
}
function popPush(){
  const el=stack.lastElementChild; if(!el) return;
  el.classList.remove('in');
  setTimeout(()=>el.remove(),450);
}
function clearStack(){ while(stack.children.length) stack.lastElementChild.remove(); }

function confirmDialog(title,msg,ok='Confirmar',danger=false){
  return new Promise(res=>{
    const el=$('#alert-root');

function actionSheet(title,options){

function openSheet(html){
  sheetRoot.innerHTML=`<div class="bk"></div><div class="sheet"><div class="grip"></div><div class="sheet-body">${html}</div></div>`;
  sheetRoot.getBoundingClientRect();
  sheetRoot.classList.add('show');
  sheetRoot.querySelector('.bk').addEventListener('click',closeSheet);
  const sheet=sheetRoot.querySelector('.sheet'), grip=sheetRoot.querySelector('.grip');
  let sy=0,dy=0,drag=false;
  grip.addEventListener('pointerdown',e=>{ drag=true; sy=e.clientY; dy=0; sheet.style.transition='none'; grip.setPointerCapture(e.pointerId); });
  grip.addEventListener('pointermove',e=>{ if(!drag)return; dy=Math.max(0,e.clientY-sy); sheet.style.transform=`translateY(${dy}px)`; });
  const end=()=>{
    if(!drag) return; drag=false; sheet.style.transition='';
    if(dy>110){
      sheet.style.transition='transform .32s cubic-bezier(.32,.72,0,1)';
      sheet.style.transform='translateY(112%)';
      sheetRoot.classList.remove('show');
      setTimeout(()=>{ sheetRoot.innerHTML=''; },360);
    } else sheet.style.transform='';
    dy=0;
  };
  grip.addEventListener('pointerup',end);
  grip.addEventListener('pointercancel',end);
}
function closeSheet(){
  sheetRoot.classList.remove('show');
  setTimeout(()=>{ sheetRoot.innerHTML=''; },400);
}

/* ---------- gráficos SVG ---------- */
function svgDonut(parts,size,sw){
  const R=(size-sw)/2, C=2*Math.PI*R, total=parts.reduce((s,p)=>s+p.val,0);
  let segs='', off=0;
  if(total>0) parts.forEach(p=>{
    const len=p.val/total*C;
    if(len<=0.01) return;
    segs+=`<circle class="seg" data-c="${C.toFixed(2)}" cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="${p.color}" stroke-width="${sw}" stroke-dasharray="${len.toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}" transform="rotate(-90 ${size/2} ${size/2})"/>`;
    off+=len;
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="donut">
    <circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="${sw}"/>${segs}</svg>`;
}
function svgRing(pct,size,sw,color){
  const R=(size-sw)/2, C=2*Math.PI*R, len=Math.max(0,Math.min(1,pct))*C;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" class="donut">
    <circle cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="rgba(255,255,255,.10)" stroke-width="${sw}"/>
    <circle class="seg" data-c="${C.toFixed(2)}" cx="${size/2}" cy="${size/2}" r="${R}" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-dasharray="${len.toFixed(2)} ${C.toFixed(2)}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`;
}
/* anima via dashoffset, apenas na 1ª exibição da página */
function animateCharts(pg){
  const segs=pg.querySelectorAll('.seg');
  if(!segs.length) return;
  if(pg._charted){
    segs.forEach(el=>{ const f=el.getAttribute('stroke-dashoffset'); if(f!=null) el.style.strokeDashoffset=f; });
    return;
  }
  pg._charted=true;
  segs.forEach(el=>{ el.style.strokeDashoffset=el.dataset.c; });
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    segs.forEach(el=>{ const f=el.getAttribute('stroke-dashoffset'); el.style.strokeDashoffset=(f==null?'':f); });
  }));
}

/* ---------- sheets: pagamento de parcela ---------- */
function openPaySheet(n){
  const ins=S.fin.installments, idx=ins.findIndex(x=>x.n===n);
  if(idx<0) return;
  const it=ins[idx], p=it.paid;
  const maxN=1+ins.slice(idx+1).filter(x=>instState(x)!=='paid').length;
  let qty=1, touched=false;
  openSheet(`
    <div class="sh-head"><div class="sh-title">Parcela ${it.n} de ${ins.length}</div>
      <button class="sh-x" data-act="close-sheet">${icon('x',15)}</button></div>
    <div class="card">
      <div class="field"><label>Valor da parcela</label><input class="mi" id="ip-nom" inputmode="decimal" value="${fmtIn(it.nominal)}"></div>
      <div class="field"><label>Vencimento</label><input type="date" id="ip-due" value="${it.due}"></div>
      <div class="field"><label>Data do pagamento</label><input type="date" id="ip-date" value="${p?p.date:todayStr()}"></div>
    </div>
    ${maxN>1?`<div class="card">
      <div class="field"><label>Parcelas incluídas</label>
        <div class="stepper" id="ip-rep"><button type="button" data-d="-1">−</button><span class="num">1</span><button type="button" data-d="1">+</button></div></div>
      <div class="note in">Antecipação: inclua várias parcelas quando quitar mais de uma de uma só vez. O valor total pago é dividido entre elas.</div>
    </div>`:''}
    <div class="card">
      <div class="field"><label>Valor total pago</label><input class="mi" id="ip-amt" inputmode="decimal" placeholder="R$ 0,00" value="${p?fmtIn(p.amount):fmtIn(it.nominal)}"></div>
    </div>
    <div class="note" id="ip-hint"></div>
    <div class="btns">
      <button class="btn pri" data-act="save-inst" data-n="${it.n}">Salvar</button>
      ${p?`<button class="btn dang" data-act="del-inst" data-n="${it.n}">Remover pagamento</button>`:''}
    </div>`);
  const selected=()=>{
    const out=[ins[idx]]; let j=idx+1;
    while(out.length<qty&&j<ins.length){ if(instState(ins[j])!=='paid') out.push(ins[j]); j++; }
    return out;
  };
  const sumSel=()=>{
    const nom=parseMoney($('#ip-nom').value)||it.nominal;
    return r2(nom+selected().slice(1).reduce((s,x)=>s+x.nominal,0));
  };
  const hint=()=>{
    const h=$('#ip-hint'); if(!h) return;
    const tot=parseMoney($('#ip-amt').value);
    if(tot==null){ h.textContent='O desconto é calculado automaticamente: valor das parcelas menos o valor pago.'; return; }
    const sum=sumSel(), d=r2(sum-tot);
    if(qty>1){
      const each=r2(tot/qty);
      h.innerHTML=`${qty} parcelas • soma ${realV(sum)} • ${realV(each)} por parcela`+
        (d>0.005?`<br>Desconto automático: <b>${realV(d)}</b>`:'');
    }else{
      h.innerHTML=d>0.005?`Desconto automático: <b>${realV(d)}</b>`
        :(tot>sum+0.005?'Valor pago acima do valor da parcela':'Parcela quitada integralmente');
    }
  };
  $('#ip-amt').addEventListener('input',()=>{ touched=true; hint(); });
  $('#ip-nom').addEventListener('input',()=>{ if(!touched) $('#ip-amt').value=fmtIn(sumSel()); hint(); });
  const rep=$('#ip-rep');
  if(rep) rep.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    qty=Math.max(1,Math.min(maxN,qty+ +b.dataset.d));
    rep.querySelector('.num').textContent=qty;
    if(!touched) $('#ip-amt').value=fmtIn(sumSel());
    hint();
  });
  hint();
}
function saveInstallment(n){
  const ins=S.fin.installments, idx=ins.findIndex(x=>x.n===n); if(idx<0) return;
  const nom=parseMoney($('#ip-nom').value);
  const date=$('#ip-date').value||todayStr(), due=$('#ip-due').value||ins[idx].due;
  const tot=parseMoney($('#ip-amt').value);
  if(!nom||nom<=0){ toast('Informe o valor da parcela',true); return; }
  if(tot==null||tot<=0){ toast('Informe o valor pago',true); return; }
  const qty=parseInt(($('#ip-rep')?.querySelector('.num')||{textContent:'1'}).textContent,10)||1;
  const sel=[ins[idx]]; let j=idx+1;
  while(sel.length<qty&&j<ins.length){ if(instState(ins[j])!=='paid') sel.push(ins[j]); j++; }
  const base=r2(Math.round((tot/sel.length)*100)/100);
  let acc=0;
  sel.forEach((it2,i)=>{
    const v=i===sel.length-1?r2(tot-acc):base;
    acc=r2(acc+v);
    if(i===0){ it2.nominal=r2(nom); it2.due=due; }
    const amt=r2(Math.max(0,v));
    it2.paid={date,amount:amt,discount:r2(Math.max(0,r2(it2.nominal-amt)))};
  });
  closeSheet(); commit();
  toast(sel.length>1?sel.length+' parcelas quitadas':'Pagamento salvo');
}

  const c=row.querySelector('.sw-c');
  if(!c||c._swiped) return; c._swiped=true;
  let sx=0,sy=0,base=0,dx=0,horiz=null,active=false;
  c.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'&&e.button!==0) return;
    active=true; horiz=null; sx=e.clientX; sy=e.clientY; dx=0;
    base=row.classList.contains('open')?-SW_W:0;
  });
  c.addEventListener('pointermove',e=>{
    if(!active) return;
    const mx=e.clientX-sx, my=e.clientY-sy;
    if(horiz===null){
      if(Math.abs(mx)<6&&Math.abs(my)<6) return;
      horiz=Math.abs(mx)>Math.abs(my);
      if(!horiz){ active=false; return; }
    }
    dx=Math.max(-SW_W-30,Math.min(0,base+mx));
    c.style.transition='none';
    c.style.transform=`translateX(${dx}px)`;
  });
  const end=e=>{
    if(!active) return; active=false;
    c.style.transition='';
    const open=dx<-SW_W*0.45;
    c.style.transform=open?`translateX(-${SW_W}px)`:'';
    row.classList.toggle('open',open);
    if(open){
      $$('.swipe-row.open').forEach(r=>{
        if(r!==row){ r.classList.remove('open'); const cc=r.querySelector('.sw-c'); if(cc) cc.style.transform=''; }
      });
    }
    if(Math.abs(e.clientX-sx)>8||Math.abs(e.clientY-sy)>8) suppressClick=true;
    dx=0;
  };
  c.addEventListener('pointerup',end);
  c.addEventListener('pointercancel',end);
}

/* ---------- gesto de voltar ---------- */
let edge=null;
stack.addEventListener('pointerdown',e=>{
  if(!stack.children.length||e.clientX>28) return;
  const el=stack.lastElementChild;
  edge={el,x:e.clientX,y:e.clientY,tx:0,ok:false};
  el.style.transition='none';
});
stack.addEventListener('pointermove',e=>{
  if(!edge) return;
  const dx=e.clientX-edge.x, dy=e.clientY-edge.y;
  if(!edge.ok){
    if(Math.abs(dx)<8&&Math.abs(dy)<8) return;
    if(Math.abs(dx)<=Math.abs(dy)){ edge.el.style.transition=''; edge=null; return; }
    edge.ok=true;
  }
  edge.tx=Math.max(0,dx);
  edge.el.style.transform=`translateX(${edge.tx}px)`;
});
const edgeEnd=()=>{
  if(!edge) return;
  const el=edge.el;
  el.style.transition='';
  if(edge.tx>90) popPush();
  else el.style.transform='';
  edge=null;
};
stack.addEventListener('pointerup',edgeEnd);
stack.addEventListener('pointercancel',edgeEnd);

/* ---------- delegação ---------- */
function updateEyeBtn(){
  const b=$('#eyeBtn'); if(!b) return;
  b.innerHTML=icon(S.hide?'eyeoff':'eye',20);
}
document.addEventListener('click',e=>{
  if(suppressClick){ suppressClick=false; e.stopPropagation(); e.preventDefault(); return; }
  const openRow=e.target.closest('.swipe-row.open');
  if(openRow&&!e.target.closest('[data-act="del-exp"]')){
    openRow.classList.remove('open');
    const c=openRow.querySelector('.sw-c'); if(c) c.style.transform='';
    e.stopPropagation(); e.preventDefault(); return;
  }
  const t=e.target.closest('[data-act]');
  if(!t) return;
  const a=t.dataset.act, d=t.dataset;
  (async ()=>{
    try{
      switch(a){
        case 'close-sheet': closeSheet(); break;
        case 'tab': switchTab(d.tab); break;
        case 'pop': popPush(); break;
        case 'toggle-hide':
          S.hide=!S.hide; save();
          updateEyeBtn();
          if(stack.children.length) refresh(); else renderView(currentTab);
          break;
        case 'fab': openQuickActions(); break;
        case 'inst': openPaySheet(+d.n); break;
        case 'save-inst': saveInstallment(+d.n); break;
        case 'del-inst': removeInstPay(+d.n); break;
        case 'settle': sheetSettle(); break;
        case 'settle-reg': sheetSettleApply(); break;
        case 'settle-do': doSettle(); break;
        case 'contract': sheetContract(); break;
        case 'edit-contract': sheetEditContract(); break;
        case 'save-contract': saveContractEdit(); break;
        case 'new-card': sheetNewCard(); break;
        case 'edit-card': sheetNewCard(cardById(d.id)); break;
        case 'del-card': delCard(d.id); break;
        case 'save-card': saveCardForm(d.id||null); break;
        case 'card': pushCardDetail(d.id); break;
        case 'card-menu': {
          const i=await actionSheet(null,[{label:'Editar cartão'},{label:'Excluir cartão e histórico',danger:true}]);
          if(i===0) sheetNewCard(cardById(d.id));
          else if(i===1) delCard(d.id);
          break;
        }
        case 'invoice': pushInvoice(d.id,d.key); break;
        case 'pay-inv': sheetPayInvoice(d.id,d.key); break;
        case 'save-pay-inv': saveInvoicePayment(d.id,d.key); break;
        case 'del-pay': delInvoicePayment(d.id,d.key,+d.i); break;
        case 'new-exp': sheetExpense(d.card||null); break;
        case 'edit-exp': sheetExpense(null,d.id); break;
        case 'save-exp': saveExpenseForm(d.id||null,d.card||null); break;
        case 'del-exp': delExpense(d.id); break;
        case 'export': exportBackup(); break;
        case 'import': importFile.click(); break;
        case 'wipe': wipeAll(); break;
      }
    }catch(err){ toast('Algo deu errado: '+err.message,true); }
  })();
});

/* ---------- PWA ---------- */
function setupPWA(){
  try{
    const c=document.createElement('canvas'); c.width=c.height=180;
    const x=c.getContext('2d');
    const rr=(cx,cy,w,h,r)=>{ x.beginPath(); x.moveTo(cx+r,cy); x.arcTo(cx+w,cy,cx+w,cy+h,r); x.arcTo(cx+w,cy+h,cx,cy+h,r); x.arcTo(cx,cy+h,cx,cy,r); x.arcTo(cx,cy,cx+w,cy,r); x.closePath(); };
    x.fillStyle='#0C0F14'; x.fillRect(0,0,180,180);
    x.fillStyle='rgba(46,229,154,.14)';
    x.beginPath(); x.moveTo(0,0); x.lineTo(180,0); x.lineTo(180,54); x.quadraticCurveTo(90,92,0,54); x.closePath(); x.fill();
    x.strokeStyle='#2EE59A'; x.fillStyle='#2EE59A';
    x.lineWidth=12; x.lineJoin='round'; x.lineCap='round';
    rr(36,64,108,80,18); x.stroke();
    x.lineWidth=10;
    x.beginPath(); x.moveTo(46,90); x.lineTo(134,90); x.stroke();
    x.beginPath(); x.arc(122,110,10,0,Math.PI*2); x.fill();
    x.strokeStyle='rgba(255,255,255,.35)'; x.lineWidth=4;
    x.beginPath(); x.arc(90,90,72,-2.5,-1.5); x.stroke();
    const url=c.toDataURL('image/png');
    const apple=document.createElement('link'); apple.rel='apple-touch-icon'; apple.href=url; document.head.appendChild(apple);
    const fav=document.createElement('link'); fav.rel='icon'; fav.href=url; document.head.appendChild(fav);
    const man={
      name:'Lume', short_name:'Lume', display:'standalone',
      start_url:location.origin+location.pathname,
      background_color:'#05060A', theme_color:'#05060A',
      icons:[{src:url,sizes:'180x180',type:'image/png'}]
    };
    const mlink=document.createElement('link'); mlink.rel='manifest';
    mlink.href=URL.createObjectURL(new Blob([JSON.stringify(man)],{type:'application/manifest+json'}));
    document.head.appendChild(mlink);
  }catch(e){}
  if('serviceWorker' in navigator)
    addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}

/* ---------- inicialização ---------- */
['home','fin','cards','set'].forEach(t=>bindNavbar($('#scroll-'+t),$('#nav-'+t)));
document.addEventListener('touchstart',()=>{},{passive:true});
setupPWA();
updateEyeBtn();
switchTab('home');
updateBadges();
</script>
